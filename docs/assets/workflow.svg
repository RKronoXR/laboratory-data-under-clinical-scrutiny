<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="460" viewBox="0 0 1320 460"><rect width="1320" height="460" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#2F5397" stroke-width="1.5"/></marker></defs><g font-family="Arial,Helvetica,sans-serif" fill="#1A2E66"><text x="20" y="35" font-size="25" font-weight="700">From source data to reproducible results</text><rect x="20" y="60" width="290" height="225" rx="14" fill="#F0F6FC" stroke="#B5D4F5" stroke-width="2"/><text x="38" y="96" font-size="21" font-weight="700">1  Source data</text><text x="38" y="133" font-size="16">ACTA-DIRECT v2</text><text x="38" y="170" font-size="16">Clinical DCBR bitewings</text><text x="38" y="207" font-size="16">ACTA-Bw25-RefStd</text><text x="38" y="244" font-size="16">Study annotation supplement</text><rect x="350" y="60" width="290" height="225" rx="14" fill="#F0F6FC" stroke="#B5D4F5" stroke-width="2"/><text x="368" y="96" font-size="21" font-weight="700">2  Train models</text><text x="368" y="133" font-size="16">Architecture comparison</text><text x="368" y="170" font-size="16">nnU-Net · YOLO · SegResNet</text><text x="368" y="207" font-size="16">Clinical-only training</text><text x="368" y="244" font-size="16">Pre-training · distillation · both</text><rect x="680" y="60" width="290" height="225" rx="14" fill="#F0F6FC" stroke="#B5D4F5" stroke-width="2"/><text x="698" y="96" font-size="21" font-weight="700">3  Assess regions</text><text x="698" y="133" font-size="16">Freeze models and thresholds</text><text x="698" y="170" font-size="16">Run image inference</text><text x="698" y="207" font-size="16">Require lesion overlap</text><text x="698" y="244" font-size="16">Retain regional predictions</text><rect x="1010" y="60" width="290" height="225" rx="14" fill="#F0F6FC" stroke="#B5D4F5" stroke-width="2"/><text x="1028" y="96" font-size="21" font-weight="700">4  Analyse results</text><text x="1028" y="133" font-size="16">Detection and Dice metrics</text><text x="1028" y="170" font-size="16">Means and SD across seeds</text><text x="1028" y="207" font-size="16">Paired multilevel analysis in R</text><text x="1028" y="244" font-size="16">Reference-result verification</text><path d="M315 173 H342" stroke="#2F5397" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M645 173 H672" stroke="#2F5397" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M975 173 H1002" stroke="#2F5397" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="320" width="1280" height="115" rx="14" fill="#EAF6F6" stroke="#5AAAAF" stroke-width="1.5"/><text x="42" y="352" font-size="21" font-weight="700">Fast reproduction without images, weights or GPU</text><text x="42" y="393" font-size="19">Included regional predictions</text><path d="M345 387 H395" stroke="#2F5397" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="417" y="393" font-size="19">Python performance tables</text><path d="M710 387 H760" stroke="#2F5397" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="782" y="393" font-size="19">R statistical comparisons and checks</text></g></svg>