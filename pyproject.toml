[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proximal-caries-laboratory-transfer"
version = "0.1.0"
description = "Reproduce laboratory transfer experiments for proximal caries lesion detection"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Ricardo Eugenio Gonzalez Valenzuela"},
  {name = "Swasti Mishra"},
  {name = "Pascal Mettes"},
  {name = "Erwin Berkhout"},
]
dependencies = []

[project.scripts]
carieslab = "carieslab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carieslab = ["py.typed"]
