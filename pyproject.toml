[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laboratory-data-under-clinical-scrutiny"
version = "0.1.0"
description = "Reproduce the clinical evaluation of laboratory data for proximal early caries lesion detection"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Ricardo Eugenio Gonzalez Valenzuela"},
  {name = "Swasti Mishra"},
  {name = "Pascal Mettes"},
  {name = "Erwin Berkhout"},
]
dependencies = []

[project.scripts]
carieslab = "carieslab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carieslab = ["py.typed"]
